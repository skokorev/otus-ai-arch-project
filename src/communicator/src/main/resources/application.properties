spring.application.name=communicator

spring.cloud.vault.token=${VAULT_TOKEN}
spring.cloud.vault.scheme=http
spring.cloud.vault.kv.enabled=true
spring.config.import=vault://

datasource.url=jdbc:postgresql://localhost:5432/crawler

communicator.mail.host=smtp.gmail.com
communicator.mail.port=587
communicator.mail.properties.mail.smtp.auth=true
communicator.mail.properties.mail.smtp.starttls.enable=true

spring.kafka.bootstrap-servers=localhost:9093

# Disable Hibernate DDL automatic changes
spring.jpa.hibernate.ddl-auto=none

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

communicator.mail-theme=Latest arXiv articles