databaseChangeLog:
  - changeSet:
      id: 1
      author: SKokorev
      changes:
        - createTable:
            tableName: user_groups
            columns:
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: group_id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
        - createTable:
            tableName: sets
            columns:
              - column:
                  name: id
                  type: varchar(40)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false