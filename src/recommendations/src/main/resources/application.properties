spring.application.name=recommendation
server.port=7080

spring.cloud.vault.host=${VAULTHOST}
spring.cloud.vault.token=${VAULT_TOKEN}
spring.cloud.vault.scheme=http
spring.cloud.vault.kv.enabled=true
spring.config.import=vault://
spring.cloud.vault.generic.enabled=false
spring.cloud.vault.kv.default-context=

recommendation.ai.openai.base-url=https://ai.api.cloud.yandex.net/v1
recommendation.ai.openai.chat.model=qwen3.6-35b-a3b/latest
recommendation.ai.openai.chat.temperature=0.1

spring.ai.model.chat=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.embedding=none
spring.ai.model.moderation=none

spring.kafka.bootstrap-servers=${KFKHOST:localhost}:9092
#spring.kafka.bootstrap-servers=localhost:19092,localhost:19093,localhost:19094

datasource.url=jdbc:postgresql://${PGHOST:localhost}:5432/recommendations

# Disable Hibernate DDL automatic changes
spring.jpa.hibernate.ddl-auto=none

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.ai.chat.observations.log-prompt=true
spring.ai.chat.client.observations.log-completion=true
management.tracing.sampling.probability=1.0
management.observations.annotations.enabled=true
management.opentelemetry.logging.export.otlp.endpoint=http://${OTEL:localhost}:4318/v1/logs
management.opentelemetry.tracing.export.otlp.endpoint=http://${OTEL:localhost}:4318/v1/traces
management.otlp.metrics.export.url=http://${OTEL:localhost}:4318/v1/metrics